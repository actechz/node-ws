<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eco Alliance</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    header {
      background-color: #2e8b57;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
    header nav a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }
    .hero {
      background-color: #111;
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 0 20px;
    }
    .hero h1 {
      font-size: 3rem;
      margin: 0;
    }
    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 20px 0;
    }
    .hero button {
      background-color: #7bd96f;
      border: none;
      padding: 15px 30px;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div style="font-size: 1.5rem; font-weight: bold;">Eco Alliance</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#initiatives">Initiatives</a>
      <a href="#involved">Get Involved</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Protect the Earth, Shape a Better Tomorrow</h1>
    <p>Join a worldwide community committed to sustainability through conservation, environmental education, and collaborative action.</p>
    <button>Join Our Mission</button>
  </section>
</body>
</html>
